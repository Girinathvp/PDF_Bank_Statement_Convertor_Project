name: Build Windows Desktop App

# Builds the actual .exe on a real Windows machine (GitHub's own Windows
# runners) -- this can't be done from Linux/macOS, since PyInstaller (and
# essentially every Python bundler) only compiles for the OS it's actually
# running on, not cross-platform.
#
# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab ("Run workflow" button). The finished .exe
# is attached as a downloadable build artifact -- no Windows machine, no
# PowerShell, no manual build steps needed on your end.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-windows.txt

      - name: Download and stage portable Tesseract OCR (for a self-contained exe)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Grabs the LATEST UB-Mannheim Tesseract-OCR Windows installer via
          # GitHub's release API (rather than a hardcoded version/filename,
          # which would silently go stale whenever they cut a new release),
          # then extracts just the files needed to bundle into the exe --
          # so the person running it doesn't need to install Tesseract
          # separately at all.
          #
          # Uses the Actions-provided GH_TOKEN to authenticate the API call:
          # unauthenticated GitHub API requests are capped at 60/hour per IP,
          # and Actions runners share IPs, so this call can otherwise be
          # rate-limited (exit code 1 with no obvious cause in the summary
          # view). Falls back to a known-good pinned version if the dynamic
          # lookup fails for any other reason, so a transient API problem
          # doesn't hard-fail the whole build.
          $ErrorActionPreference = "Stop"
          $FALLBACK_URL = "https://github.com/UB-Mannheim/tesseract/releases/download/v5.4.0.20240606/tesseract-ocr-w64-setup-5.4.0.20240606.exe"

          $downloadUrl = $null
          try {
            Write-Host "Looking up latest UB-Mannheim/tesseract release via GitHub API..."
            $headers = @{ "User-Agent" = "github-actions"; "Accept" = "application/vnd.github+json" }
            if ($env:GH_TOKEN) { $headers["Authorization"] = "Bearer $env:GH_TOKEN" }
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/UB-Mannheim/tesseract/releases/latest" -Headers $headers
            $asset = $release.assets | Where-Object { $_.name -match "w64-setup.*\.exe$" } | Select-Object -First 1
            if ($asset) {
              $downloadUrl = $asset.browser_download_url
              Write-Host "Found latest release asset: $($asset.name)"
            } else {
              Write-Host "WARNING: API call succeeded but no w64-setup .exe asset was found in the response. Falling back to pinned version."
            }
          } catch {
            Write-Host "WARNING: Dynamic release lookup failed ($($_.Exception.Message)). Falling back to pinned version."
          }

          if (-not $downloadUrl) {
            $downloadUrl = $FALLBACK_URL
            Write-Host "Using fallback URL: $downloadUrl"
          }

          Write-Host "Downloading Tesseract installer..."
          Invoke-WebRequest -Uri $downloadUrl -OutFile tesseract-installer.exe
          $installerInfo = Get-Item tesseract-installer.exe
          Write-Host "Downloaded installer: $($installerInfo.Length) bytes"
          if ($installerInfo.Length -lt 1000000) {
            throw "Downloaded installer is suspiciously small ($($installerInfo.Length) bytes) -- likely an HTML error page instead of the real installer. Check $downloadUrl manually."
          }

          Write-Host "Running silent install..."
          $installDir = "C:\tesseract-install"
          $proc = Start-Process -FilePath ".\tesseract-installer.exe" -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          Write-Host "Installer exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) {
            throw "Tesseract installer exited with a non-zero code ($($proc.ExitCode)) -- the install itself failed rather than merely landing in an unexpected folder. This usually means a corrupted download or an incompatible installer flag; check the exit code against NSIS's standard error codes, or try the install manually on a Windows machine to see what it reports interactively."
          }

          # Some NSIS builds return control to the parent process slightly
          # before background file extraction finishes -- give it a moment.
          Start-Sleep -Seconds 5

          # /D should place files at $installDir, but fall back to
          # Tesseract's own default location in case that flag was ignored
          # for any reason (verified needed on at least one real run: the
          # installer exited 0 but tesseract.exe wasn't at the /D path).
          $candidates = @("$installDir\tesseract.exe", "C:\Program Files\Tesseract-OCR\tesseract.exe")
          $foundExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $foundExe) {
            Write-Host "tesseract.exe not found at any expected location. Diagnostics:"
            Write-Host "Contents of ${installDir}:"
            if (Test-Path $installDir) { Get-ChildItem $installDir -Recurse | Select-Object -First 30 } else { Write-Host "  (directory does not exist)" }
            Write-Host "Contents of C:\Program Files\Tesseract-OCR:"
            if (Test-Path "C:\Program Files\Tesseract-OCR") { Get-ChildItem "C:\Program Files\Tesseract-OCR" -Recurse | Select-Object -First 30 } else { Write-Host "  (directory does not exist)" }
            throw "tesseract.exe not found after a silent install that reported success (exit code 0). See the directory listings above -- the installer may have used a different location, or silently no-op'd. Check https://github.com/UB-Mannheim/tesseract for current installer usage."
          }

          $actualInstallDir = Split-Path $foundExe -Parent
          Write-Host "Found tesseract.exe at: $foundExe"

          New-Item -ItemType Directory -Force -Path backend\tesseract | Out-Null
          Copy-Item -Path "$actualInstallDir\*" -Destination backend\tesseract -Recurse -Force
          Write-Host "Tesseract staged successfully at backend\tesseract:"
          Get-ChildItem backend\tesseract | Select-Object -First 20

      - name: Build the .exe with PyInstaller
        working-directory: backend
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "BankStatementConverter" `
            --add-data "..\frontend;frontend" `
            --add-data "tesseract;tesseract" `
            desktop_app.py

      - name: Upload the .exe as a downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BankStatementConverter-windows-exe
          path: backend/dist/BankStatementConverter.exe
          retention-days: 90
